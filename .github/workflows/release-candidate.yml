name: Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "docs/releases/**"
      - ".github/workflows/release-candidate.yml"
      - "scripts/rc2_installed_smoke.py"

permissions:
  contents: read

jobs:
  rc-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify release candidate version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          assert data['project']['version'] == '2.0.0rc2', data['project']['version']
          print('version=2.0.0rc2')
          PY
      - name: Install release candidate from working tree
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install dist/botte_secrete-2.0.0rc2-py3-none-any.whl
      - name: Verify installed wheel outside source imports
        run: python -I scripts/rc2_installed_smoke.py
      - name: Verify installed metadata and assurance import
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import skills.factory_assurance as assurance
          assert version('botte-secrete') == '2.0.0rc2'
          assert callable(assurance.evaluate_assurance)
          print('installed=2.0.0rc2')
          print('factory_assurance=importable')
          PY
      - name: Run full regression suite
        run: python scripts/run_tests.py -q
        timeout-minutes: 10
      - name: Validate documentation
        run: |
          python scripts/test_readme_commands.py
          python scripts/check_docs_links.py
      - name: Run deterministic assurance contracts explicitly
        run: |
          python -m skills.factory_assurance.test_factory_assurance
          python -m skills.factory_assurance.test_integrations
          python -m skills.factory_assurance.test_roles
      - name: Record exact release candidate identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'release_candidate_sha=%s\nrelease_candidate_tree=%s\n' \
            "${GITHUB_SHA}" "$(git rev-parse HEAD^{tree})"
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl'))
          evidence = {
              'tested_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tested_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
              'version': '2.0.0rc2',
          }
          Path('dist/evidence.json').write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print(json.dumps(evidence))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: rc2-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/evidence.json
          retention-days: 30
