<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Botte Secrète : de l'annonce à la preuve</title><desc id="desc">Rapport terminé sans preuve ; Botte signale une anomalie ; trois tests dont une erreur ; correction préparée, trois tests réussis. Scénario préparé, exécutions réelles.</desc><rect width="960" height="300" rx="18" fill="#f4f1e9"/><g font-family="sans-serif" fill="#202d2a"><text x="30" y="48" font-size="25" font-weight="bold">« Terminé » mérite une preuve.</text><text x="30" y="77" font-size="15">Scénario préparé · audits et tests réellement exécutés</text><g font-size="18" font-weight="bold"><text x="30" y="139">01 Annonce</text><text x="266" y="139">02 Contrôle</text><text x="502" y="139">03 Test</text><text x="738" y="139">04 Correction</text></g><g font-size="16"><text x="30" y="177">« Terminé »</text><text x="30" y="202">sans preuve jointe</text><text x="266" y="177">Botte : 1 anomalie</text><text x="266" y="202">Preuve manquante</text><text x="502" y="177">3 tests, 1 erreur</text><text x="502" y="202">Division par zéro</text><text x="738" y="177">3 tests réussis</text><text x="738" y="202">Résultats consultables</text></g><text x="30" y="264" font-size="15" fill="#79401b">Limite : A11 détecte des marqueurs de preuve ; il n'en vérifie pas l'authenticité.</text></g></svg>