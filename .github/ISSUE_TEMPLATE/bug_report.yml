name: Bug report
description: Report a reproducible problem in Botte Secrète
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private
        project contents, or vulnerability details. Security issues must follow
        SECURITY.md instead of using a public issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe steps, command, and input that reproduce the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Release, branch, or full commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, relevant backend, and whether the worktree is clean.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Paste the smallest relevant log or traceback after removing private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private paths, endpoints, and proprietary data.
          required: true
        - label: This is not a security vulnerability.
          required: true
