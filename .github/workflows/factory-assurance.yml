name: Factory Assurance

on:
  pull_request:
    paths:
      - "skills/factory_assurance/**"
      - "examples/factory-assurance/**"
      - ".github/workflows/factory-assurance.yml"

permissions:
  contents: read

jobs:
  deterministic-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run assurance unit contract
        run: python -m skills.factory_assurance.test_factory_assurance
      - name: Run assurance integration contract
        run: python -m skills.factory_assurance.test_integrations
      - name: Run named agent role contract
        run: python -m skills.factory_assurance.test_roles
      - name: Run private holdout runner contract
        run: python -m skills.factory_assurance.test_private_holdout
      - name: Positive control must pass
        run: python -m skills.factory_assurance.cli examples/factory-assurance/run.json
      - name: Real StoryCore dark lap must become review-ready without promotion authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from skills.factory_assurance.assurance import evaluate_assurance

          run = json.loads(Path('examples/factory-assurance/storycore-pr57-shadow.json').read_text(encoding='utf-8'))
          decision = evaluate_assurance(run)
          assert decision['status'] == 'review_ready', decision
          assert decision['may_merge_automatically'] is False, decision
          assert decision['may_deploy_automatically'] is False, decision
          print(json.dumps(decision, indent=2, sort_keys=True))
          PY
      - name: Record exact candidate identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'source_sha=%s\nbuild_sha=%s\ntested_sha=%s\n' \
            "${GITHUB_SHA}" "${GITHUB_SHA}" "${GITHUB_SHA}"
