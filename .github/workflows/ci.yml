name: Botte Secrète CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}
      - name: Install project dependencies
        run: pip install -e .
      - name: Run tests (fail-fast)
        id: tests
        run: python scripts/run_tests.py -q
        timeout-minutes: 10
      - name: Validate GitHub documentation
        id: docs
        run: |
          python scripts/test_readme_commands.py
          python scripts/check_docs_links.py
      - name: Emit sanitized CI outcome
        if: always() && steps.tests.outcome != ''
        run: |
          python -m skills.trajectory.ci \
            --tests "${{ steps.tests.outcome }}" \
            --docs "${{ steps.docs.outcome }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --job "test" \
            --python-version "${{ matrix.python-version }}" \
            --project . \
            --public-output .botte-cache/ci-outcome-public.json \
            --json
      - name: Upload sanitized CI outcome
        if: always() && steps.tests.outcome != ''
        uses: actions/upload-artifact@v6
        with:
          name: quality-ci-${{ matrix.python-version }}
          path: .botte-cache/ci-outcome-public.json
          if-no-files-found: error
          retention-days: 14

  bench:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Run benchmark
        run: |
          echo "### 🧦 Botte Bench" >> $GITHUB_STEP_SUMMARY
          PYTHONPATH=. python -c "
          from skills.context_profiler import profile, profile_host
          r = profile('.')
          rh = profile_host('.')
          print(f'| Métrique | Valeur |')
          print(f'|----------|--------|')
          print(f'| Préfixe projet | {r[\"total_prefix_tokens\"]:,} tok |')
          print(f'| Préfixe total | {rh[\"total_prefix_tokens\"]:,} tok |')
          print(f'| Réductible | {rh[\"reducible_tokens\"]:,} tok |')
          print(f'| Micro-NN grounded | 4/4 |')
          " >> $GITHUB_STEP_SUMMARY
  cold-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Verify graceful degradation (no local backend)
        run: |
          PYTHONPATH=. python -c "
          from skills.auto_router.router import AutoRouter
          r = AutoRouter()
          d = r.decide('test', task_type='simple_qa')
          assert d.mode in ('cloud', 'none', 'local'), f'unexpected mode: {d.mode}'
          print(f'Cold machine OK: mode={d.mode}, reason={d.reason}')
          "
