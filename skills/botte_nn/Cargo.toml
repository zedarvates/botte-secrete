[package]
name = "botte_nn"
version = "0.1.0"
edition = "2024"
description = "Tiny feedforward neural network for Botte Secrète — 0 token inference"

[[bin]]
name = "botte_nn_cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
