name: Release Candidate

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "docs/releases/**"
      - ".github/workflows/release-candidate.yml"

permissions:
  contents: read

jobs:
  rc-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release candidate version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          assert data['project']['version'] == '2.0.0rc1', data['project']['version']
          print('version=2.0.0rc1')
          PY
      - name: Install release candidate from working tree
        run: python -m pip install .
      - name: Verify installed metadata and assurance import
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import skills.factory_assurance as assurance
          assert version('botte-secrete') == '2.0.0rc1'
          assert callable(assurance.evaluate_assurance)
          print('installed=2.0.0rc1')
          print('factory_assurance=importable')
          PY
      - name: Run deterministic assurance contracts
        run: |
          python -m skills.factory_assurance.test_factory_assurance
          python -m skills.factory_assurance.test_integrations
          python -m skills.factory_assurance.test_roles
      - name: Record exact release candidate identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'release_candidate_sha=%s\nrelease_candidate_tree=%s\n' \
            "${GITHUB_SHA}" "$(git rev-parse HEAD^{tree})"
